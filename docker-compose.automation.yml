# Overlay for docker-compose.prod.yml. Load it only when enabling automation.
services:
  n8n-db:
    profiles: [automation]
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    environment:
      POSTGRES_DB: n8n
      POSTGRES_PASSWORD: ${N8N_POSTGRES_ADMIN_PASSWORD:?Đặt N8N_POSTGRES_ADMIN_PASSWORD}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?Đặt N8N_DB_PASSWORD}
    volumes:
      - n8n_db_data:/var/lib/postgresql/data
      - ./src/backend/integrations/n8n/init-db.sql:/docker-entrypoint-initdb.d/01-n8n.sql:ro
      - ./src/backend/integrations/n8n/backup-db.sh:/backup-n8n.sh:ro
      - ./src/backend/var/backups/n8n:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d n8n"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 10
    networks: [automation-data]
    restart: unless-stopped

  n8n:
    profiles: [automation]
    image: n8nio/n8n:2.48.6
    depends_on:
      n8n-db:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?Đặt N8N_DB_PASSWORD}
      GENERIC_TIMEZONE: Asia/Ho_Chi_Minh
      TZ: Asia/Ho_Chi_Minh
      N8N_HOST: ${N8N_DOMAIN:?Đặt N8N_DOMAIN}
      N8N_PROTOCOL: https
      N8N_WEBHOOK_URL: https://${N8N_DOMAIN}/
      N8N_EDITOR_BASE_URL: https://${N8N_DOMAIN}/
      N8N_PROXY_HOPS: "1"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Đặt N8N_ENCRYPTION_KEY}
      N8N_SECURE_COOKIE: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      N8N_PUBLIC_API_DISABLED: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_SSRF_PROTECTION_ENABLED: "true"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      EXECUTIONS_DATA_PRUNE: "true"
    volumes:
      - n8n_state:/home/node/.n8n
    networks: [automation-data, automation-edge]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 45s
      retries: 12
    restart: unless-stopped

  caddy:
    command: ["caddy", "run", "--config", "/etc/caddy/automation.Caddyfile", "--adapter", "caddyfile"]
    environment:
      N8N_DOMAIN: ${N8N_DOMAIN}
      N8N_ADMIN_NETWORKS: ${N8N_ADMIN_NETWORKS:?Đặt danh sách IP/CIDR quản trị}
    volumes:
      - ./caddy/automation.Caddyfile:/etc/caddy/automation.Caddyfile:ro
    networks: [internal, automation-edge]

networks:
  automation-data:
    internal: true
  automation-edge:
    driver: bridge

volumes:
  n8n_db_data:
  n8n_state:
